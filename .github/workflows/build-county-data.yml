name: Build county election data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_county_data.py"
      - ".github/workflows/build-county-data.yml"

permissions:
  contents: write

concurrency:
  group: county-election-data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build compact county files
        run: python scripts/build_county_data.py
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/county
          if git diff --cached --quiet; then
            echo "County data is already current."
          else
            git commit -m "Build county House and Senate history"
            git push
          fi
